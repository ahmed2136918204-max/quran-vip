<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b251b">
  <title>أنت غير متصل بالإنترنت</title>
  <style>
    :root {
      --bg-1: #071913;
      --bg-2: #103326;
      --card: rgba(11, 37, 27, 0.9);
      --border: rgba(255, 215, 0, 0.25);
      --accent: #ffd700;
      --text: #f3f4f6;
      --muted: #c7ced4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 215, 0, 0.08), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(255, 215, 0, 0.06), transparent 40%),
        linear-gradient(140deg, var(--bg-2), var(--bg-1));
      color: var(--text);
      font-family: "Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      padding: 20px;
    }

    .offline-card {
      width: min(94vw, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      padding: 28px 22px;
      text-align: center;
    }

    .logo {
      width: 84px;
      height: 84px;
      border-radius: 999px;
      object-fit: cover;
      border: 2px solid rgba(255, 215, 0, 0.4);
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(1.2rem, 1rem + 1.2vw, 1.9rem);
      color: var(--accent);
      margin-bottom: 10px;
    }

    p {
      line-height: 1.95;
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 18px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.2);
      color: var(--accent);
      margin-bottom: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #f97316;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button,
    a {
      border: 0;
      text-decoration: none;
      border-radius: 14px;
      padding: 11px 15px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:active,
    a:active {
      transform: scale(0.97);
    }

    .primary-btn {
      background: var(--accent);
      color: #072015;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="Gemini_Generated_Image_umrraiumrraiumrr.png" alt="شعار البوابة" class="logo">
    <div class="status"><span class="dot"></span> لا يوجد اتصال بالإنترنت الآن</div>
    <h1>الوضع غير المتصل مفعل</h1>
    <p>
      يمكنك العودة للمحتوى المتاح محليًا فور رجوع الشبكة.
      إذا استمر الانقطاع، جرّب إعادة المحاولة بعد قليل.
    </p>

    <div class="actions">
      <button class="primary-btn" onclick="window.location.reload()">إعادة المحاولة</button>
      <a class="secondary-btn" href="./index.html">العودة للرئيسية</a>
    </div>
  </main>
</body>
</html>
